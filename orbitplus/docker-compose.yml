services:
  orbitplusmaster:
    build: .
    ports:
      - "8082:8082"
    depends_on:
      dragonfly:
        condition: service_started
      cassandra-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      MASTER_API_PORT: ${MASTER_API_PORT:-8082}
      ORBITPLUS_UI_ACCESS_TOKEN: ${ORBITPLUS_UI_ACCESS_TOKEN:-}
      DRAGONFLY_ADDRESS: ${DRAGONFLY_ADDRESS:-dragonfly:6379}
      DRAGONFLY_PASSWORD: ${DRAGONFLY_PASSWORD:-}
      DRAGONFLY_DATABASE: ${DRAGONFLY_DATABASE:-0}
      DRAGONFLY_CONNECTION_TIMEOUT: ${DRAGONFLY_CONNECTION_TIMEOUT:-5s}
      CASSANDRA_HOSTS: ${CASSANDRA_HOSTS:-cassandra}
      CASSANDRA_PORT: ${CASSANDRA_PORT:-9042}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-orbitplus}
      RABBITMQ_URL: ${RABBITMQ_URL:-}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-}
      RABBITMQ_MANAGEMENT_URL: ${RABBITMQ_MANAGEMENT_URL:-}
      RABBITMQ_MANAGEMENT_USERNAME: ${RABBITMQ_MANAGEMENT_USERNAME:-}
      RABBITMQ_MANAGEMENT_PASSWORD: ${RABBITMQ_MANAGEMENT_PASSWORD:-}
      RABBITMQ_MANAGEMENT_VHOST: ${RABBITMQ_MANAGEMENT_VHOST:-/}
      RABBITMQ_MANAGEMENT_TIMEOUT: ${RABBITMQ_MANAGEMENT_TIMEOUT:-5s}
      ORBIT_ROUTE_BASE_URL: ${ORBIT_ROUTE_BASE_URL:-}
      ORBIT_ROUTE_ACCESS_TOKEN: ${ORBIT_ROUTE_ACCESS_TOKEN:-}
      ORBIT_ROUTE_TIMEOUT: ${ORBIT_ROUTE_TIMEOUT:-}
      ORBIT_ROUTE_REFRESH_INTERVAL: ${ORBIT_ROUTE_REFRESH_INTERVAL:-}
      ORBIT_ROUTE_STALE_DURATION: ${ORBIT_ROUTE_STALE_DURATION:-}
      # Live verification (cacheFlag=0). Zone, credentials, from, to, and date
      # come from the GET; these two are optional tuning for the Bits fetch.
      BITS_HTTP_TIMEOUT: ${BITS_HTTP_TIMEOUT:-}
      LIVE_VERIFICATION_MAX_CONCURRENT: ${LIVE_VERIFICATION_MAX_CONCURRENT:-}
      CASSANDRA_USERNAME: ${CASSANDRA_USERNAME:-}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD:-}
      CASSANDRA_CONNECTION_TIMEOUT: ${CASSANDRA_CONNECTION_TIMEOUT:-5s}

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"

  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      TZ: Asia/Kolkata
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  # Creates the keyspace and then applies the table schema. Applying the schema
  # here rather than by hand means a fresh environment starts with every table
  # the service writes to. Without it the service starts fine and only reveals a
  # missing table as a background write failure in the log, which is easy to miss.
  #
  # Every statement in the schema files is CREATE ... IF NOT EXISTS, so this is
  # safe to re-run. It does NOT reconcile a table whose columns have drifted;
  # that still needs a hand-written ALTER.
  cassandra-init:
    image: cassandra:5.0
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./scripts:/schema:ro
    command: >
      sh -c "cqlsh cassandra 9042 -e \"CREATE KEYSPACE IF NOT EXISTS ${CASSANDRA_KEYSPACE:-orbitplus}
      WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};\" &&
      for file in /schema/create_*.cql; do
      echo \"applying $$file\";
      cqlsh cassandra 9042 -k ${CASSANDRA_KEYSPACE:-orbitplus} -f \"$$file\" || exit 1;
      done"
