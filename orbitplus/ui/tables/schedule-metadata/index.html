<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule Metadata | OrbitPlus Master</title><link rel="stylesheet" href="/orbitplus/styles.css">
</head>
<body>
  <header class="report-header"><a class="brand" href="/orbitplus/">OrbitPlus <span>Master</span></a><nav class="page-nav"><a href="/orbitplus/tables">Tables</a><a href="/orbitplus/reports/queue-jobs">Queue Metrics</a></nav></header>
  <main class="report-shell"><div class="report-title"><div><p class="eyebrow">TABLES</p><h1>Schedule Metadata</h1></div></div>
    <form class="lookup-form" id="lookup-form"><label>Operator<input name="operator" required></label><label>Schedule<input name="schedule" required></label><label>Travel date<input name="travel" type="date" required></label><button class="primary-button" type="submit">Look up metadata</button></form>
    <section class="report-table" aria-label="Schedule metadata"><div class="table-scroll"><table><thead><tr><th>Operator</th><th>Schedule</th><th>Travel Date</th><th>Trip Code</th><th>Trip Stage Code</th><th>Updated At</th></tr></thead><tbody id="metadata-body"></tbody></table></div></section>
  </main>
  <script>
    const form = document.getElementById("lookup-form"), body = document.getElementById("metadata-body");
    function empty(title, detail) { body.replaceChildren(); const row = document.createElement("tr"), cell = document.createElement("td"), heading = document.createElement("strong"), message = document.createElement("span"); cell.colSpan = 6; cell.className = "empty-state"; heading.textContent = title; message.textContent = detail; cell.append(heading, message); row.append(cell); body.append(row); }
    function render(rows) { if (!rows.length) return empty("No schedule metadata found", "No rows match this complete schedule key."); body.replaceChildren(); rows.forEach((item) => { const row = document.createElement("tr"); [item.operatorCode, item.scheduleCode, item.travelDate, item.tripCode, item.tripStageCode, item.updatedAt ? new Date(item.updatedAt).toLocaleString() : "—"].forEach((value) => { const cell = document.createElement("td"); cell.textContent = value || "—"; row.append(cell); }); body.append(row); }); }
    form.addEventListener("submit", (event) => { event.preventDefault(); const query = new URLSearchParams(new FormData(form)); fetch("/orbitplus/api/tables/schedule-metadata?" + query, { credentials: "same-origin" }).then((response) => response.ok ? response.json() : Promise.reject()).then((response) => render(response.data || [])).catch(() => empty("Unable to load schedule metadata", "Check the required lookup values and Cassandra connection.")); });
    empty("Enter a schedule lookup", "Operator, schedule, and travel date are required.");
  </script>
</body>
</html>
