<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Periodic Refresh Routes | OrbitPlus Master</title><link rel="stylesheet" href="/orbitplus/styles.css">
</head>
<body>
  <header class="report-header"><a class="brand" href="/orbitplus/">OrbitPlus <span>Master</span></a><nav class="page-nav"><a href="/orbitplus/tables">Tables</a><a href="/orbitplus/reports/queue-jobs">Queue Metrics</a></nav></header>
  <main class="report-shell"><div class="report-title"><div><p class="eyebrow">TABLES</p><h1>Periodic Refresh Routes</h1></div></div>
    <section class="report-table" aria-label="Periodic refresh routes"><div class="table-scroll"><table><thead><tr><th>Operator</th><th>Travel Date</th><th>From</th><th>To</th><th>Ticket Count</th><th>Active</th><th>Updated At</th></tr></thead><tbody id="routes-body"></tbody></table></div></section>
  </main>
  <script>
    const body = document.getElementById("routes-body");
    const value = (item) => item || "—";
    const time = (item) => item ? new Date(item).toLocaleString() : "—";
    function empty(title, detail) { body.replaceChildren(); const row = document.createElement("tr"), cell = document.createElement("td"), heading = document.createElement("strong"), message = document.createElement("span"); cell.colSpan = 7; cell.className = "empty-state"; heading.textContent = title; message.textContent = detail; cell.append(heading, message); row.append(cell); body.append(row); }
    function render(routes) { if (!routes.length) return empty("No periodic routes found", "No active or inactive routes are stored."); body.replaceChildren(); routes.forEach((route) => { const row = document.createElement("tr"); [route.operatorCode, route.travelDate, route.fromStation, route.toStation, route.ticketCount, route.isActive ? "Yes" : "No", time(route.updatedAt)].forEach((item) => { const cell = document.createElement("td"); cell.textContent = value(item); row.append(cell); }); body.append(row); }); }
    fetch("/orbitplus/api/tables/periodic-refresh-routes", { credentials: "same-origin" }).then((response) => response.ok ? response.json() : Promise.reject()).then((response) => render(response.data || [])).catch(() => empty("Unable to load periodic routes", "Refresh after the service is connected to Cassandra."));
  </script>
</body>
</html>
